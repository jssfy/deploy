events {
    worker_connections 1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # 详细日志格式（包含请求头）
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'auth_org="$auth_organization_id" '
                       'auth_account="$auth_account_id" '
                       'auth_space="$auth_space_id" '
                       'auth_hash="$auth_hash_key" '
                       'auth_req_id="$auth_request_id"';
    
    # 请求头日志格式（用于调试）
    log_format headers '$remote_addr [$time_local] "$request" '
                      'org_id="$auth_organization_id" '
                      'account_id="$auth_account_id" '
                      'space_id="$auth_space_id" '
                      'hash_key="$auth_hash_key" '
                      'request_id="$auth_request_id" '
                      'x_org="$http_x_organization_id" '
                      'x_account="$http_x_account_id" '
                      'x_space="$http_x_space_id"';
    
    # 访问日志和错误日志
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/headers.log headers;
    error_log /var/log/nginx/error.log;
    
    # 性能优化设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # 客户端请求设置
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # 包含鉴权代理配置
    include /etc/nginx/proxy_with_auth.conf;
    
    # 主服务器配置（仅HTTP）
    server {
        listen 80;
        server_name localhost www.yeanhua.asia;
        
        # 根目录配置（用于静态文件）
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # 定义变量（用于存储鉴权结果）
        set $auth_organization_id "";
        set $auth_account_id "";
        set $auth_space_id "";
        set $auth_hash_key "";
        set $auth_request_id "";
        
        # 方案：使用 POST 请求到鉴权服务
        # 注意：标准 nginx 的 auth_request 不支持 POST，需要使用 lua 模块
        # 如果使用 openresty，可以使用下面的 lua 配置
        # 如果使用标准 nginx，需要修改鉴权服务支持 GET，或使用其他方案
        
        location / {
            # 先进行鉴权检查（使用 POST 请求）
            # 注意：这需要 lua 模块支持（OpenResty）
            access_by_lua_block {
                local cjson = require "cjson"
                
                -- 读取请求头中的认证信息
                local auth_header = ngx.var.http_authorization or ngx.var.http_x_api_key or ""
                if auth_header == "" then
                    ngx.status = 401
                    ngx.header.content_type = "application/json"
                    ngx.say('{"error":"Missing authentication"}')
                    ngx.exit(401)
                end
                
                -- 构建请求体
                local request_body = {
                    auth_header = auth_header,
                    uri = ngx.var.request_uri,
                    method = ngx.var.request_method
                }
                
                -- 使用 ngx.location.capture 发送子请求到内部 location
                -- 这个内部 location 会转发 POST 请求到鉴权服务
                local res = ngx.location.capture("/_auth_post", {
                    method = ngx.HTTP_POST,
                    body = cjson.encode(request_body),
                    args = {},
                    ctx = { var = ngx.var }
                })
                
                if not res then
                    ngx.log(ngx.ERR, "Auth service error: failed to capture")
                    ngx.status = 502
                    ngx.header.content_type = "application/json"
                    ngx.say('{"error":"Auth service unavailable"}')
                    ngx.exit(502)
                end
                
                if res.status ~= 200 then
                    ngx.log(ngx.ERR, "Auth failed: ", res.status, " body: ", res.body)
                    ngx.status = res.status
                    ngx.header.content_type = "application/json"
                    ngx.say(res.body or '{"error":"Authentication failed"}')
                    ngx.exit(res.status)
                end
                
                -- 解析响应 JSON
                local ok, auth_data = pcall(cjson.decode, res.body)
                if not ok then
                    ngx.log(ngx.ERR, "Failed to parse auth response: ", res.body)
                    ngx.status = 502
                    ngx.exit(502)
                end
                
                -- 设置变量，供后续使用
                -- ⚠️ 注意：以下变量映射是示例配置，基于鉴权服务返回的 JSON 字段
                -- 请根据实际需求修改：
                -- 1. 修改变量名（如 auth_organization_id）
                -- 2. 修改对应的 JSON 字段名（如 organization_id）
                -- 3. 添加或删除不需要的变量
                -- 4. 在 proxy_set_header 中（第151-155行）也需要同步修改
                ngx.var.auth_organization_id = auth_data.organization_id or ""
                ngx.var.auth_account_id = auth_data.account_id or ""
                ngx.var.auth_space_id = auth_data.space_id or ""
                ngx.var.auth_hash_key = auth_data.hash_key or ""
                ngx.var.auth_request_id = auth_data.request_id or ""
            }
            
            # 代理到后端服务器
            proxy_pass http://backend_server;
            
            # 设置基础代理头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 使用鉴权服务返回的信息（从 lua 变量中读取）
            # ⚠️ 注意：以下请求头是示例配置，基于鉴权服务返回的 JSON 字段
            # 请根据实际需求修改：
            # 1. 修改请求头名称（如 X-Organization-ID）
            # 2. 修改对应的变量名（如 $auth_organization_id）
            # 3. 添加或删除不需要的请求头
            # 4. 在 Lua 脚本中（第132-136行）也需要同步修改变量设置
            proxy_set_header X-Organization-ID $auth_organization_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Space-ID $auth_space_id;
            proxy_set_header X-Hash-Key $auth_hash_key;
            proxy_set_header X-Request-ID $auth_request_id;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 重定向处理
            proxy_redirect off;
            
            # 错误处理
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }
        
        # 内部 location：转发 POST 请求到鉴权服务
        location = /_auth_post {
            internal;
            
            # 代理到鉴权服务（POST 请求）
            proxy_pass http://auth_service/auth/api_key;
            proxy_method POST;
            
            # 设置请求头
            proxy_set_header Content-Type "application/json";
            proxy_set_header Host "localhost:8888";
            
            # 传递请求体
            proxy_pass_request_body on;
            proxy_set_header Content-Length $content_length;
            
            # 超时设置
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # 不缓冲响应
            proxy_buffering off;
        }
        
        # 健康检查端点（跳过鉴权）
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 代理状态页面（跳过鉴权）
        location /proxy-status {
            access_log off;
            return 200 "HTTP Proxy with Auth (POST) is running\nAuth Service: localhost:8888/auth/api_key\nBackend: localhost:8000\n";
            add_header Content-Type text/plain;
        }
        
        # 调试端点：显示所有请求头（包括鉴权服务返回的）
        # 注意：这个端点会经过鉴权，可以查看鉴权后的请求头
        location /debug/headers {
            # 先进行鉴权（获取鉴权信息）
            access_by_lua_block {
                local cjson = require "cjson"
                
                local auth_header = ngx.var.http_authorization or ngx.var.http_x_api_key or ""
                if auth_header == "" then
                    ngx.status = 401
                    ngx.header.content_type = "application/json"
                    ngx.say('{"error":"Missing authentication"}')
                    ngx.exit(401)
                end
                
                local request_body = {
                    auth_header = auth_header,
                    uri = ngx.var.request_uri,
                    method = ngx.var.request_method
                }
                
                local res = ngx.location.capture("/_auth_post", {
                    method = ngx.HTTP_POST,
                    body = cjson.encode(request_body),
                    args = {},
                    ctx = { var = ngx.var }
                })
                
                if not res or res.status ~= 200 then
                    ngx.status = res and res.status or 502
                    ngx.header.content_type = "application/json"
                    ngx.say(res and res.body or '{"error":"Auth service unavailable"}')
                    ngx.exit(ngx.status)
                end
                
                local ok, auth_data = pcall(cjson.decode, res.body)
                if not ok then
                    ngx.status = 502
                    ngx.exit(502)
                end
                
                ngx.var.auth_organization_id = auth_data.organization_id or ""
                ngx.var.auth_account_id = auth_data.account_id or ""
                ngx.var.auth_space_id = auth_data.space_id or ""
                ngx.var.auth_hash_key = auth_data.hash_key or ""
                ngx.var.auth_request_id = auth_data.request_id or ""
            }
            
            # 返回所有请求头信息（JSON 格式）
            content_by_lua_block {
                local cjson = require "cjson"
                cjson.encode_empty_table_as_object(false)
                
                local headers = {}
                for k, v in pairs(ngx.req.get_headers()) do
                    headers[k] = v
                end
                
                local response = {
                    auth_info = {
                        organization_id = ngx.var.auth_organization_id or "",
                        account_id = ngx.var.auth_account_id or "",
                        space_id = ngx.var.auth_space_id or "",
                        hash_key = ngx.var.auth_hash_key or "",
                        request_id = ngx.var.auth_request_id or ""
                    },
                    request_headers = headers,
                    forwarded_headers = {
                        ["X-Organization-ID"] = ngx.var.auth_organization_id or "",
                        ["X-Account-ID"] = ngx.var.auth_account_id or "",
                        ["X-Space-ID"] = ngx.var.auth_space_id or "",
                        ["X-Hash-Key"] = ngx.var.auth_hash_key or "",
                        ["X-Request-ID"] = ngx.var.auth_request_id or ""
                    },
                    request_info = {
                        uri = ngx.var.request_uri or "",
                        method = ngx.var.request_method or "",
                        host = ngx.var.host or "",
                        remote_addr = ngx.var.remote_addr or ""
                    }
                }
                
                ngx.header.content_type = "application/json"
                local json_str = cjson.encode(response)
                ngx.say(json_str)
            }
        }
        
        # 错误页面
        error_page 401 /401.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # 401错误页面
        location = /401.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # 403错误页面
        location = /403.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # 404错误页面
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # 50x错误页面
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
